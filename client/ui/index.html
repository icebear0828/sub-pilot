<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sub-Pilot 局域网实时生肉字幕</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: rgba(10, 10, 14, 0.92);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }
    header {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4757;
    }
    .dot.connected { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button, select {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    button:hover, select:hover { background: rgba(255, 255, 255, 0.22); }
    select option { background: #222; color: #fff; }
    button.active {
      background: #00d2d3;
      color: #111;
      font-weight: 600;
      border-color: #00d2d3;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 30px;
      gap: 16px;
    }
    .subtitle-card {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px 28px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .original-line {
      font-size: 17px;
      color: #ffd32a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.4;
    }
    .lang-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 211, 42, 0.2);
      color: #ffd32a;
      border: 1px solid rgba(255, 211, 42, 0.4);
      text-transform: uppercase;
    }
    .translated-line {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.5px;
    }
    .meta-line {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    footer {
      padding: 10px 20px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <header>
    <div class="status-badge">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">连接中...</span>
    </div>
    <div class="controls">
      <select id="langSelect" title="语种锁定模式">
        <option value="auto">🌐 自动识别</option>
        <option value="ja">🇯🇵 日语 (追番/生肉)</option>
        <option value="en">🇺🇸 英语 (美剧/公开课)</option>
        <option value="zh">🇨🇳 中文 (仅字幕)</option>
        <option value="ko">🇰🇷 韩语</option>
      </select>
      <button id="toggleAudioBtn">🎙️ 本机音频推流</button>
      <button id="fontSizeBtn">🔠 字体大小</button>
      <button id="opacityBtn">🌓 透明背景</button>
    </div>
  </header>

  <main id="subContainer">
    <div class="subtitle-card">
      <div class="original-line">
        <span class="lang-tag">READY</span>
        <span>Sub-Pilot 局域网超低延迟实时字幕系统已就绪</span>
      </div>
      <div class="translated-line" id="mainSub">
        等待视频音频信号接入...
      </div>
      <div class="meta-line">
        <span>延迟: -- ms</span>
        <span>后端: Rust + SenseVoice ONNX</span>
      </div>
    </div>
  </main>

  <footer>
    局域网无感推流 · 统一内存 32GB Mac 本地算力加速 · 极速多语言路由
  </footer>

  <script>
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const subContainer = document.getElementById('subContainer');
    const toggleAudioBtn = document.getElementById('toggleAudioBtn');
    const fontSizeBtn = document.getElementById('fontSizeBtn');
    const opacityBtn = document.getElementById('opacityBtn');
    const langSelect = document.getElementById('langSelect');

    let ws;
    let audioContext;
    let mediaStream;
    let isStreamingAudio = false;
    let currentFontSizeIndex = 1;
    const fontSizes = ['22px', '28px', '36px', '44px'];
    let isTransparent = false;

    function sendLanguageChoice() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        const lang = langSelect.value;
        ws.send(JSON.stringify({ action: 'set_language', language: lang }));
      }
    }

    langSelect.addEventListener('change', sendLanguageChoice);

    function connectWs() {
      const loc = window.location;
      const wsUri = (loc.protocol === 'https:' ? 'wss://' : 'ws://') + loc.host + '/ws';
      ws = new WebSocket(wsUri);

      ws.onopen = () => {
        statusDot.classList.add('connected');
        statusText.innerText = '已连接到 Mac 算力中心';
        sendLanguageChoice();
      };

      ws.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          renderSubtitle(payload);
        } catch (e) {
          console.error(e);
        }
      };

      ws.onclose = () => {
        statusDot.classList.remove('connected');
        statusText.innerText = '连接断开，3秒后重连...';
        setTimeout(connectWs, 3000);
      };
    }

    function renderSubtitle(payload) {
      const currentFontSize = fontSizes[currentFontSizeIndex];
      const lang = (payload.language || payload.lang || 'AUTO').toUpperCase();
      const rawText = payload.text || payload.original || '';
      const translatedText = payload.translated || '';
      const isChinese = lang === 'ZH' || lang === 'YUE';

      // 检查当前屏幕上是否已有这句字幕卡片（阶段 1 刚上屏）
      let card = document.getElementById(`sub-card-${payload.id}`);

      if (!card) {
        card = document.createElement('div');
        card.className = 'subtitle-card';
        card.id = `sub-card-${payload.id}`;

        // 保持只显示最新的字幕
        subContainer.innerHTML = '';
        subContainer.appendChild(card);
      }

      const isPartial = payload.is_final === false || payload.stage === 'partial';

      if (isChinese) {
        card.innerHTML = `
          <div class="translated-line" style="font-size: ${currentFontSize}">
            ${escapeHtml(rawText)}${isPartial ? '<span style="opacity: 0.6; animation: blink 1s infinite;"> ▎</span>' : ''}
          </div>
          <div class="meta-line">
            <span>🇨🇳 中文原音</span>
            <span>${isPartial ? '⚡ 流式输入中' : `⚡ 推理: ${payload.latency_ms} ms`}</span>
          </div>
        `;
      } else {
        // 外语（日/英/韩）：三段式流式显示
        // 1. partial: 打字机流式增量（带闪烁光标 ▎）
        // 2. asr: 停顿原音定稿
        // 3. trans: 智能意译完成
        let transContent;
        if (translatedText) {
          transContent = escapeHtml(translatedText);
        } else if (isPartial) {
          transContent = `<span style="opacity: 0.35; font-size: 0.85em; font-weight: 400;">正在实时输入...</span>`;
        } else {
          transContent = `<span style="opacity: 0.45; font-size: 0.85em; font-weight: 400;">正在智能意译...</span>`;
        }

        card.innerHTML = `
          <div class="original-line">
            <span class="lang-tag">${escapeHtml(lang)}</span>
            <span>${escapeHtml(rawText)}${isPartial ? '<span style="opacity: 0.7; animation: blink 0.8s infinite;"> ▎</span>' : ''}</span>
          </div>
          <div class="translated-line" style="font-size: ${currentFontSize}">
            ${transContent}
          </div>
          <div class="meta-line">
            <span>${payload.stage === 'trans' ? '🎬 意译完成' : (isPartial ? '⚡ 正在说话' : '✅ 定稿跟读')}</span>
            <span>${isPartial ? '实时打字' : `延迟: ${payload.latency_ms} ms`}</span>
          </div>
        `;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    // 本机音频推流（将当前设备的麦克风/内录音频推给 Mac 进行 ASR）
    toggleAudioBtn.addEventListener('click', async () => {
      if (!isStreamingAudio) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          const httpsUrl = 'https://' + window.location.hostname + ':8766/';
          alert('当前浏览器禁止在非安全 HTTP 页面录音。\n\n请直接访问 HTTPS 加密通道以启用麦克风：\n' + httpsUrl);
          return;
        }
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
          audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
          const source = audioContext.createMediaStreamSource(mediaStream);
          const processor = audioContext.createScriptProcessor(4096, 1, 1);

          processor.onaudioprocess = (e) => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const inputData = e.inputBuffer.getChannelData(0);
            // 转换为 16-bit PCM 二进制发送
            const pcmBuffer = new ArrayBuffer(inputData.length * 2);
            const view = new DataView(pcmBuffer);
            for (let i = 0; i < inputData.length; i++) {
              let s = Math.max(-1, Math.min(1, inputData[i]));
              view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            ws.send(pcmBuffer);
          };

          source.connect(processor);
          processor.connect(audioContext.destination);

          isStreamingAudio = true;
          toggleAudioBtn.classList.add('active');
          toggleAudioBtn.innerText = '🔴 正在推流音频';
        } catch (err) {
          alert('无法启动音频录制: ' + err.message);
        }
      } else {
        if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        if (audioContext) audioContext.close();
        isStreamingAudio = false;
        toggleAudioBtn.classList.remove('active');
        toggleAudioBtn.innerText = '🎙️ 本机音频推流';
      }
    });

    // 字体调节
    fontSizeBtn.addEventListener('click', () => {
      currentFontSizeIndex = (currentFontSizeIndex + 1) % fontSizes.length;
      document.querySelectorAll('.translated-line').forEach(el => {
        el.style.fontSize = fontSizes[currentFontSizeIndex];
      });
    });

    // 透明背景调节
    opacityBtn.addEventListener('click', () => {
      isTransparent = !isTransparent;
      document.body.style.backgroundColor = isTransparent ? 'rgba(0, 0, 0, 0.15)' : 'rgba(10, 10, 14, 0.92)';
      opacityBtn.classList.toggle('active', isTransparent);
    });

    connectWs();
  </script>
</body>
</html>
