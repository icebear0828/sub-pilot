<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻语集 VoiceForge Mini</title>
  <style>
    :root {
      --bg-dark: #0e1117;
      --bg-panel: rgba(22, 27, 34, 0.92);
      --bg-card: #161b22;
      --border-color: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --accent-color: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --danger: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    /* ─── 顶栏控制 ─── */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 14px;
      background: rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid var(--border-subtle);
      cursor: grab;
    }

    .header-bar:active {
      cursor: grabbing;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      background: var(--accent-gradient);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
      color: #fff;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
    }

    /* 核心大号录音按钮 */
    .btn-record {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success);
      color: #000;
      font-weight: 600;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
    }

    .btn-record:hover {
      transform: scale(1.04);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.5);
    }

    .btn-record.recording {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.5);
      animation: pulse-btn 1.5s infinite;
    }

    @keyframes pulse-btn {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .status-badge.listening {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    .status-badge.recording {
      background: rgba(244, 63, 94, 0.2);
      color: var(--danger);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: default;
    }

    .mic-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
      max-width: 150px;
      cursor: pointer;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent-color);
    }

    .btn-icon.active {
      background: var(--accent-color);
      color: #000;
    }

    .btn-icon.danger:hover {
      background: var(--danger);
      color: #fff;
    }

    /* ─── 提示条（报错 / 模型未就绪提示） ─── */
    .banner-alert {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      font-size: 11px;
      background: rgba(245, 158, 11, 0.15);
      border-bottom: 1px solid rgba(245, 158, 11, 0.3);
      color: #fde68a;
    }

    .banner-alert.error {
      background: rgba(244, 63, 94, 0.15);
      border-bottom-color: rgba(244, 63, 94, 0.3);
      color: #fecdd3;
    }

    .banner-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }

    /* ─── 视图 A：Mini HUD 悬浮条 ─── */
    #hud-view {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 18px;
      height: calc(100% - 48px);
      gap: 8px;
    }

    .hud-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .level-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .level-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #10b981 70%, #f43f5e 95%);
      transition: width 0.08s ease;
      border-radius: 4px;
    }

    .dbfs-text {
      font-size: 11px;
      font-family: monospace;
      color: var(--text-dim);
      width: 52px;
      text-align: right;
    }

    .rec-timer {
      font-size: 13px;
      font-family: monospace;
      font-weight: 600;
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .hud-text-preview {
      font-size: 13px;
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 12px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── 视图 B：语料清洗工作台 ─── */
    #workbench-view {
      display: none;
      flex-direction: column;
      height: calc(100% - 48px);
      overflow: hidden;
    }

    .workbench-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid var(--border-subtle);
      gap: 12px;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .stat-item strong {
      color: var(--text-main);
      font-size: 13px;
      margin-left: 3px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--accent-color);
    }

    .btn-action.primary {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      font-weight: 500;
    }

    .keyboard-hint {
      padding: 6px 16px;
      background: rgba(56, 189, 248, 0.05);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--accent-color);
    }

    .table-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px;
    }

    .utterance-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .utterance-card.verified {
      border-left: 3px solid var(--success);
    }

    .play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .play-btn:hover {
      background: var(--accent-color);
      color: #000;
    }

    .card-meta {
      width: 130px;
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-muted);
    }

    .card-text-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-main);
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .card-text-input:focus {
      border-color: var(--accent-color);
    }

    /* ─── 导出模态窗 ─── */
    .modal-backdrop {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .form-input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 顶栏 -->
    <div class="header-bar" id="drag-region">
      <div class="brand-section">
        <div class="brand-icon">VF</div>
        <div class="brand-title">轻语集</div>

        <!-- 显目核心录制大按钮 -->
        <button class="btn-record" id="record-btn">▶ 开始录音</button>

        <div class="status-badge" id="status-badge">
          <div class="status-dot"></div>
          <span id="status-text">待机空闲</span>
        </div>
      </div>

      <div class="header-actions">
        <!-- 麦克风设备切换 -->
        <select class="mic-select" id="mic-select" title="选择录音麦克风">
          <option value="">默认麦克风</option>
        </select>

        <!-- 视图切换：HUD / 工作台 -->
        <button class="btn-icon" id="view-toggle-btn" title="打开语料校对工作台">🪟</button>

        <!-- 打开语料文件夹 -->
        <button class="btn-icon" id="folder-btn" title="打开本地语料库目录">📁</button>

        <!-- 复制日志 -->
        <button class="btn-icon" id="log-btn" title="一键复制系统调试日志">📋</button>

        <!-- 最小化到任务栏 -->
        <button class="btn-icon" id="minimize-btn" title="最小化到任务栏">—</button>

        <!-- 隐藏至托盘 -->
        <button class="btn-icon danger" id="close-btn" title="隐藏至右下角系统托盘 (后台继续静默录音)">×</button>
      </div>
    </div>

    <!-- 异常 / 模型状态条 -->
    <div class="banner-alert" id="banner-alert">
      <span id="banner-text">💡 提示：尚未检测到 SenseVoice 模型，语音将正常无损录制为 WAV 切片。</span>
      <div style="display:flex; gap:6px;">
        <button class="banner-btn" id="copy-err-btn" style="display:none;">📋 复制报错</button>
        <button class="banner-btn" id="open-model-btn">打开模型文件夹</button>
      </div>
    </div>

    <!-- 视图 A：Mini HUD 悬浮胶囊 -->
    <div id="hud-view">
      <div class="hud-metrics">
        <div style="flex:1; display:flex; align-items:center; gap:8px;">
          <div class="level-bar-bg">
            <div class="level-bar-fill" id="hud-level-fill"></div>
          </div>
          <div class="dbfs-text" id="hud-dbfs">-100.0 dB</div>
        </div>
        <div class="rec-timer" id="hud-timer">00.0s</div>
      </div>

      <div class="hud-text-preview" id="hud-preview">
        <span id="hud-last-text">点击顶部「▶ 开始录音」，对着麦克风说话即可自动断句切片...</span>
      </div>
    </div>

    <!-- 视图 B：语料清洗工作台 -->
    <div id="workbench-view">
      <div class="workbench-toolbar">
        <div class="stats-group">
          <div>有效切片:<strong id="stat-count">0</strong> 条</div>
          <div>总净时长:<strong id="stat-duration">00:00</strong></div>
          <div>已校验:<strong id="stat-verified">0</strong></div>
        </div>

        <div style="display:flex; gap:8px;">
          <button class="btn-action" id="batch-asr-btn">⚡ 批量转写</button>
          <button class="btn-action primary" id="open-export-modal-btn">📦 导出训练集</button>
        </div>
      </div>

      <div class="keyboard-hint">
        💡 <b>盲打极速校对</b>：选中输入框按 <b>[Tab]</b> 试听重播 | 修改文本后按 <b>[Enter]</b> 确认校验并自动跳转下一行播放
      </div>

      <div class="table-container" id="utterance-list"></div>
    </div>
  </div>

  <!-- 导出模态窗 -->
  <div class="modal-backdrop" id="export-modal">
    <div class="modal-panel">
      <div style="font-weight:600; font-size:15px;">导出模型训练集</div>

      <div class="form-group">
        <label class="form-label">导出格式</label>
        <select class="form-input" id="export-format">
          <option value="gpt_sovits">GPT-SoVITS 声音克隆 (wavs/ + train.list)</option>
          <option value="jsonl">JSONL 通用多模态 (HuggingFace / Whisper / LLM)</option>
          <option value="ljspeech">LJSpeech 经典格式 (wavs/ + metadata.csv)</option>
          <option value="srt_md">SRT / Markdown 字幕与时间轴归档</option>
          <option value="all">打包导出全部格式</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">目标本地文件夹路径</label>
        <input class="form-input" id="export-dir" type="text" placeholder="/Users/.../dataset" />
      </div>

      <div style="display:flex; gap:12px; font-size:12px; color:var(--text-muted);">
        <label><input type="checkbox" id="export-only-verified" checked /> 仅导出已校验样本</label>
        <label><input type="checkbox" id="export-copy-audio" checked /> 复制 WAV 音频</label>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
        <button class="btn-action" id="close-export-modal-btn">取消</button>
        <button class="btn-action primary" id="confirm-export-btn">开始导出</button>
      </div>
    </div>
  </div>

  <audio id="audio-player"></audio>

  <script>
    const { invoke } = window.__TAURI__.core;

    let isCapturing = false;
    let currentViewMode = "hud";
    let utterances = [];
    const audioPlayer = document.getElementById("audio-player");
    const recordBtn = document.getElementById("record-btn");
    const micSelect = document.getElementById("mic-select");

    // ── 拖拽与关闭 ──
    document.getElementById("drag-region").addEventListener("mousedown", (e) => {
      if (e.target.closest("button") || e.target.closest("select")) return;
      invoke("start_dragging");
    });
    document.getElementById("minimize-btn").addEventListener("click", () => invoke("minimize_window"));
    document.getElementById("close-btn").addEventListener("click", () => invoke("close_window"));
    document.getElementById("folder-btn").addEventListener("click", () => invoke("open_data_directory"));
    document.getElementById("open-model-btn").addEventListener("click", () => invoke("open_model_directory"));

    document.getElementById("log-btn").addEventListener("click", async () => {
      try {
        const logs = await invoke("get_log_contents");
        await navigator.clipboard.writeText(logs);
        alert("已成功复制系统调试日志到剪贴板！可以直接粘贴。");
      } catch (e) {
        alert("复制日志失败: " + e);
      }
    });

    document.getElementById("copy-err-btn").addEventListener("click", async () => {
      try {
        const text = document.getElementById("banner-text").textContent;
        await navigator.clipboard.writeText(text);
        alert("已复制错误信息！");
      } catch (e) {
        alert("复制失败: " + e);
      }
    });

    // ── 录音核心大按钮点击 ──
    recordBtn.addEventListener("click", async () => {
      try {
        if (!isCapturing) {
          const selectedDevice = micSelect.value || null;
          await invoke("start_recording", { deviceName: selectedDevice });
          isCapturing = true;
          recordBtn.textContent = "⏹ 停止录音";
          recordBtn.classList.add("recording");
        } else {
          await invoke("stop_recording");
          isCapturing = false;
          recordBtn.textContent = "▶ 开始录音";
          recordBtn.classList.remove("recording");
        }
      } catch (err) {
        showError("录音启动失败: " + err);
      }
    });

    // ── 麦克风设备列表初始化 ──
    async function loadDevices() {
      try {
        const devices = await invoke("list_input_devices");
        micSelect.innerHTML = `<option value="">默认麦克风</option>`;
        devices.forEach(d => {
          const opt = document.createElement("option");
          opt.value = d.name;
          opt.textContent = (d.is_default ? "★ " : "") + d.name;
          micSelect.appendChild(opt);
        });
      } catch (e) {
        console.error("Failed to list devices:", e);
      }
    }
    loadDevices();

    micSelect.addEventListener("change", async () => {
      if (isCapturing) {
        await invoke("start_recording", { deviceName: micSelect.value || null });
      }
    });

    // ── 视图切换 ──
    const viewToggleBtn = document.getElementById("view-toggle-btn");
    const hudView = document.getElementById("hud-view");
    const workbenchView = document.getElementById("workbench-view");

    viewToggleBtn.addEventListener("click", async () => {
      currentViewMode = currentViewMode === "hud" ? "workbench" : "hud";
      if (currentViewMode === "workbench") {
        hudView.style.display = "none";
        workbenchView.style.display = "flex";
        viewToggleBtn.classList.add("active");
        await invoke("switch_view_mode", { mode: "workbench" });
        loadUtterances();
      } else {
        hudView.style.display = "flex";
        workbenchView.style.display = "none";
        viewToggleBtn.classList.remove("active");
        await invoke("switch_view_mode", { mode: "hud" });
      }
    });

    function showError(msg) {
      const banner = document.getElementById("banner-alert");
      const text = document.getElementById("banner-text");
      const copyBtn = document.getElementById("copy-err-btn");
      banner.className = "banner-alert error";
      banner.style.display = "flex";
      text.textContent = msg;
      if (copyBtn) copyBtn.style.display = "inline-block";
    }

    // ── 状态轮询 ──
    async function pollStatus() {
      try {
        const s = await invoke("get_app_status");
        isCapturing = s.is_capturing;

        // 同步大按钮状态
        if (isCapturing) {
          recordBtn.textContent = "⏹ 停止录音";
          recordBtn.classList.add("recording");
        } else {
          recordBtn.textContent = "▶ 开始录音";
          recordBtn.classList.remove("recording");
        }

        // 状态徽标
        const statusBadge = document.getElementById("status-badge");
        const statusText = document.getElementById("status-text");
        statusBadge.className = "status-badge " + s.status;

        if (s.status === "recording") {
          statusText.textContent = "正在录制";
        } else if (s.status === "listening") {
          statusText.textContent = "监听中 (随时说话)";
        } else {
          statusText.textContent = "待机空闲 (点击开始)";
        }

        // 电平条
        const fillPercent = Math.min(100, Math.max(0, (s.peak_dbfs + 60) * (100 / 60)));
        document.getElementById("hud-level-fill").style.width = fillPercent + "%";
        document.getElementById("hud-dbfs").textContent = s.peak_dbfs.toFixed(1) + " dB";

        // 录制计时
        if (s.current_duration_s > 0) {
          document.getElementById("hud-timer").textContent = s.current_duration_s.toFixed(1) + "s";
          document.getElementById("hud-timer").style.color = "var(--danger)";
        } else {
          document.getElementById("hud-timer").textContent = "00.0s";
          document.getElementById("hud-timer").style.color = "var(--text-main)";
        }

        // 错误及模型提示
        const banner = document.getElementById("banner-alert");
        const bannerText = document.getElementById("banner-text");
        const copyErrBtn = document.getElementById("copy-err-btn");
        if (s.error_message) {
          banner.className = "banner-alert error";
          banner.style.display = "flex";
          bannerText.textContent = s.error_message;
          if (copyErrBtn) copyErrBtn.style.display = "inline-block";
        } else if (!s.model_ready) {
          banner.className = "banner-alert";
          banner.style.display = "flex";
          bannerText.textContent = "💡 提示：尚未检测到 SenseVoice 模型，语音将正常无损切片保存为 WAV。";
          if (copyErrBtn) copyErrBtn.style.display = "none";
        } else {
          banner.style.display = "none";
        }

        // 实时自动刷新切片列表：当有新句子切片完成或转写结束时自动更新工作台
        if (s.total_utterances !== undefined && s.total_utterances !== lastTotalUtterances) {
          lastTotalUtterances = s.total_utterances;
          loadUtterances();
        } else if (s.pending_asr_count !== undefined && s.pending_asr_count !== lastPendingAsrCount) {
          lastPendingAsrCount = s.pending_asr_count;
          loadUtterances();
        }

      } catch (err) {
        console.error("Poll status error:", err);
      }
    }
    let lastTotalUtterances = -1;
    let lastPendingAsrCount = -1;
    setInterval(pollStatus, 120);

    // ── 语料工作台 ──
    async function loadUtterances() {
      try {
        const activeInput = document.activeElement;
        const activeId = (activeInput && activeInput.classList.contains("card-text-input"))
          ? activeInput.closest(".utterance-card")?.dataset.id
          : null;
        const selStart = activeInput ? activeInput.selectionStart : null;
        const selEnd = activeInput ? activeInput.selectionEnd : null;

        utterances = await invoke("list_utterances", { sessionId: null, statusFilter: null });
        renderList(activeId, selStart, selEnd);
        updateStats();
      } catch (err) {
        console.error("Failed to load utterances:", err);
      }
    }

    function updateStats() {
      const valid = utterances.filter(u => u.status !== "Rejected");
      const totalMs = valid.reduce((acc, u) => acc + u.duration_ms, 0);
      const verified = valid.filter(u => u.verified).length;

      document.getElementById("stat-count").textContent = valid.length;
      const totalSec = Math.floor(totalMs / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      document.getElementById("stat-duration").textContent =
        `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      document.getElementById("stat-verified").textContent = `${verified} / ${valid.length}`;
    }

    function renderList(preserveActiveId, selStart, selEnd) {
      const listEl = document.getElementById("utterance-list");
      listEl.innerHTML = "";

      if (utterances.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-dim); font-size: 13px;">暂无语音切片，点击顶部「▶ 开始录音」后说话即可自动切片。</div>`;
        return;
      }

      utterances.forEach((u, idx) => {
        const card = document.createElement("div");
        card.className = "utterance-card" + (u.verified ? " verified" : "");
        card.dataset.index = idx;
        card.dataset.id = u.id;

        const durSec = (u.duration_ms / 1000).toFixed(1) + "s";
        card.innerHTML = `
          <button class="play-btn" data-path="${u.audio_filepath}" title="播放 (Tab)">▶</button>
          <div class="card-meta">
            <div>${u.id}</div>
            <div style="display:flex; gap:6px; margin-top:2px;">
              <span>${durSec}</span>
              <span>${u.peak_dbfs.toFixed(1)}dB</span>
            </div>
          </div>
          <input type="text" class="card-text-input" value="${escapeHtml(u.text)}" placeholder="输入或校对文字..." />
          <button class="btn-action ${u.verified ? 'primary' : ''}" data-action="verify">${u.verified ? '✓ 已校验' : '确认'}</button>
          <button class="btn-action" style="color:var(--danger);" data-action="delete">🗑️</button>
        `;

        card.querySelector(".play-btn").addEventListener("click", () => playAudio(u.audio_filepath));

        const input = card.querySelector(".card-text-input");
        input.addEventListener("keydown", async (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            await invoke("update_utterance_text", { id: u.id, text: input.value, textNormalized: null, verified: true });
            u.text = input.value;
            u.verified = true;
            card.classList.add("verified");
            // 跳下一行
            const nextCard = document.querySelector(`.utterance-card[data-index="${idx + 1}"]`);
            if (nextCard) {
              const nextInput = nextCard.querySelector(".card-text-input");
              if (nextInput) {
                nextInput.focus();
                playAudio(utterances[idx + 1].audio_filepath);
              }
            }
          } else if (e.key === "Tab") {
            e.preventDefault();
            playAudio(u.audio_filepath);
          }
        });

        card.querySelector('[data-action="verify"]').addEventListener("click", async () => {
          await invoke("mark_utterance_status", { id: u.id, status: u.verified ? "Transcribed" : "Verified" });
          u.verified = !u.verified;
          card.classList.toggle("verified", u.verified);
          updateStats();
        });

        card.querySelector('[data-action="delete"]').addEventListener("click", async () => {
          await invoke("delete_utterance", { id: u.id });
          utterances.splice(idx, 1);
          renderList();
          updateStats();
        });

        listEl.appendChild(card);
      });

      if (preserveActiveId) {
        const inputToFocus = listEl.querySelector(`.utterance-card[data-id="${preserveActiveId}"] .card-text-input`);
        if (inputToFocus) {
          inputToFocus.focus();
          if (selStart !== null && selEnd !== null) {
            try { inputToFocus.setSelectionRange(selStart, selEnd); } catch (_) {}
          }
        }
      }
    }

    async function playAudio(filepath) {
      try {
        const dataUrl = await invoke("read_audio_base64", { filepath });
        audioPlayer.src = dataUrl;
        audioPlayer.play();
      } catch (err) {
        console.error("Play audio failed:", err);
      }
    }

    function escapeHtml(text) {
      return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // ── 导出 ──
    const exportModal = document.getElementById("export-modal");
    document.getElementById("open-export-modal-btn").addEventListener("click", () => {
      exportModal.style.display = "flex";
      if (!document.getElementById("export-dir").value) {
        document.getElementById("export-dir").value = "~/voiceforge_dataset";
      }
    });

    document.getElementById("close-export-modal-btn").addEventListener("click", () => exportModal.style.display = "none");

    document.getElementById("confirm-export-btn").addEventListener("click", async () => {
      const format = document.getElementById("export-format").value;
      const targetDir = document.getElementById("export-dir").value;
      const onlyVerified = document.getElementById("export-only-verified").checked;
      const copyAudio = document.getElementById("export-copy-audio").checked;

      if (!targetDir.trim()) {
        alert("请输入导出目录路径！");
        return;
      }

      try {
        const res = await invoke("export_dataset", {
          options: { format, targetDir, sessionId: null, onlyVerified, valRatio: 0.1, copyAudio }
        });
        alert(res);
        exportModal.style.display = "none";
      } catch (err) {
        alert("导出失败: " + err);
      }
    });

    // 批量 ASR
    document.getElementById("batch-asr-btn").addEventListener("click", async () => {
      try {
        const count = await invoke("run_batch_asr", { sessionId: null });
        alert(`已开始后台转写 ${count} 条切片！`);
        setTimeout(loadUtterances, 1500);
      } catch (err) {
        alert("批量转写失败: " + err);
      }
    });

    pollStatus();
  </script>
</body>
</html>
