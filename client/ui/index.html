<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻语集 VoiceForge Mini</title>
  <style>
    :root {
      --bg-dark: #0e1117;
      --bg-panel: rgba(22, 27, 34, 0.88);
      --bg-card: #161b22;
      --border-color: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --accent-color: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --danger: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
      --purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── 统一主卡片 ─── */
    .app-container {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    /* ─── 顶栏（通用控制条） ─── */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 14px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--border-subtle);
      cursor: grab;
    }

    .header-bar:active {
      cursor: grabbing;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
      background: var(--accent-gradient);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
      color: #fff;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .status-badge.recording {
      background: rgba(244, 63, 94, 0.2);
      color: var(--danger);
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.3);
    }

    .status-badge.listening {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-color);
    }

    .status-badge.muted {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    .status-badge.silent {
      background: rgba(168, 85, 247, 0.2);
      color: var(--purple);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.recording .status-dot {
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.25); opacity: 1; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: default;
    }

    .mode-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent-color);
    }

    .btn-icon.active {
      background: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
    }

    .btn-icon.danger:hover {
      background: var(--danger);
      color: #fff;
    }

    /* ─── 视图 A：Mini HUD 悬浮胶囊 ─── */
    #hud-view {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 18px;
      height: calc(100% - 44px);
      gap: 8px;
    }

    .hud-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .level-meter-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .level-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .level-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #10b981 70%, #f43f5e 95%);
      transition: width 0.08s ease;
      border-radius: 4px;
    }

    .dbfs-text {
      font-size: 11px;
      font-family: monospace;
      color: var(--text-dim);
      width: 52px;
      text-align: right;
    }

    .rec-timer {
      font-size: 13px;
      font-family: monospace;
      font-weight: 600;
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .hud-text-preview {
      font-size: 13px;
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 12px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-emotion-pill {
      font-size: 10px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-color);
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 8px;
    }

    /* ─── 视图 B：语料清洗工作台 ─── */
    #workbench-view {
      display: none;
      flex-direction: column;
      height: calc(100% - 44px);
      overflow: hidden;
    }

    .workbench-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid var(--border-subtle);
      gap: 12px;
      flex-wrap: wrap;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .stat-item strong {
      color: var(--text-main);
      font-size: 13px;
      margin-left: 3px;
    }

    .filter-group {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      font-weight: 500;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--accent-color);
    }

    .btn-action.primary {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      font-weight: 500;
    }

    .btn-action.primary:hover {
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .keyboard-hint {
      padding: 6px 16px;
      background: rgba(56, 189, 248, 0.05);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px;
    }

    .utterance-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s;
    }

    .utterance-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .utterance-card.focused {
      border-color: var(--accent-color);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.15);
    }

    .utterance-card.verified {
      border-left: 3px solid var(--success);
    }

    .utterance-card.clipping {
      border-left: 3px solid var(--danger);
    }

    .play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .play-btn:hover {
      background: var(--accent-color);
      color: #000;
      transform: scale(1.05);
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 140px;
      flex-shrink: 0;
    }

    .card-id {
      font-size: 11px;
      font-family: monospace;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-tags {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tag {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
    }

    .tag.clipping-tag {
      background: rgba(244, 63, 94, 0.2);
      color: var(--danger);
      font-weight: 600;
    }

    .card-input-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-text-input {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-main);
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
      user-select: text;
      -webkit-user-select: text;
    }

    .card-text-input:focus {
      border-color: var(--accent-color);
      background: rgba(0, 0, 0, 0.4);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ─── 导出模态窗 ─── */
    .modal-backdrop {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 480px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .form-input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 顶栏 -->
    <div class="header-bar" id="drag-region">
      <div class="brand-section">
        <div class="brand-icon">VF</div>
        <div class="brand-title">轻语集 (VoiceForge Mini)</div>
        <div class="status-badge listening" id="status-badge">
          <div class="status-dot"></div>
          <span id="status-text">就绪</span>
        </div>
      </div>

      <div class="header-actions">
        <!-- 采集模式切换 -->
        <select class="mode-select" id="mode-select" title="采集模式">
          <option value="continuous_vad">🎙️ 连续 VAD 自动切句</option>
          <option value="silent_deferred">🤫 静默采集（纯切片，极省资源）</option>
          <option value="silent_realtime">⚡ 静默采集（后台实时 ASR）</option>
          <option value="push_to_talk">🛑 按住说话 (Push-to-Talk)</option>
        </select>

        <!-- 一键消音 (Panic Mute) -->
        <button class="btn-icon" id="mute-btn" title="紧急物理消音 (Panic Mute)">🎙️</button>

        <!-- 视图切换：Mini HUD / 语料工作台 -->
        <button class="btn-icon" id="view-toggle-btn" title="切换视图模式 (HUD / 工作台)">🪟</button>

        <!-- 打开存储目录 -->
        <button class="btn-icon" id="folder-btn" title="打开语料库文件夹">📁</button>

        <!-- 最小化/隐藏 -->
        <button class="btn-icon danger" id="close-btn" title="隐藏至托盘">×</button>
      </div>
    </div>

    <!-- 视图 A：Mini HUD 悬浮胶囊 -->
    <div id="hud-view">
      <div class="hud-metrics">
        <div class="level-meter-wrapper">
          <div class="level-bar-bg">
            <div class="level-bar-fill" id="hud-level-fill"></div>
          </div>
          <div class="dbfs-text" id="hud-dbfs">-100.0 dB</div>
        </div>
        <div class="rec-timer" id="hud-timer">00.0s</div>
      </div>

      <div class="hud-text-preview" id="hud-preview">
        <span id="hud-last-text">等待语音录入...</span>
        <span class="hud-emotion-pill" id="hud-emotion-badge" style="display:none;">平静</span>
      </div>
    </div>

    <!-- 视图 B：语料清洗工作台 -->
    <div id="workbench-view">
      <!-- 统计与操作工具栏 -->
      <div class="workbench-toolbar">
        <div class="stats-group">
          <div class="stat-item">有效切片:<strong id="stat-count">0</strong> 条</div>
          <div class="stat-item">总净时长:<strong id="stat-duration">00:00</strong></div>
          <div class="stat-item">已校验:<strong id="stat-verified">0</strong></div>
          <div class="stat-item" id="stat-pending-item">待转写:<strong id="stat-pending">0</strong></div>
        </div>

        <div style="display: flex; gap: 8px; align-items: center;">
          <div class="filter-group">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="Pending_ASR">待转写</button>
            <button class="filter-btn" data-filter="Transcribed">待校验</button>
            <button class="filter-btn" data-filter="Verified">已校验</button>
          </div>

          <!-- 批量 ASR 按钮 -->
          <button class="btn-action" id="batch-asr-btn">⚡ 批量转写</button>

          <!-- 导出按钮 -->
          <button class="btn-action primary" id="open-export-modal-btn">📦 导出训练集</button>
        </div>
      </div>

      <div class="keyboard-hint">
        <span>💡 <b>盲打流快捷操作</b>：选中行按 [Tab] 试听重播 | 编辑文本后按 [Enter] 确认已校验并跳下一行 | [Delete] 剔除废片</span>
      </div>

      <!-- 语料列表容器 -->
      <div class="table-container" id="utterance-list">
        <!-- 动态生成列表项 -->
      </div>
    </div>
  </div>

  <!-- 导出对话框模态窗 -->
  <div class="modal-backdrop" id="export-modal">
    <div class="modal-panel">
      <div class="modal-title">导出模型训练数据集</div>

      <div class="form-group">
        <label class="form-label">导出目标框架格式</label>
        <select class="form-input" id="export-format">
          <option value="gpt_sovits">GPT-SoVITS 专属 (wavs/ + train.list)</option>
          <option value="jsonl">JSONL 通用多模态 (HuggingFace / Whisper / LLM)</option>
          <option value="ljspeech">LJSpeech 经典格式 (wavs/ + metadata.csv)</option>
          <option value="srt_md">SRT / Markdown 时间轴语料归档</option>
          <option value="all">全量打包导出全部格式</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">导出目标本地目录路径</label>
        <input class="form-input" id="export-dir" type="text" placeholder="/Users/.../dataset" />
      </div>

      <div class="form-group">
        <label class="form-label">验证集切分比例 (Val Split Ratio: 0% ~ 20%)</label>
        <input class="form-input" id="export-val-ratio" type="number" min="0" max="0.3" step="0.05" value="0.1" />
      </div>

      <div style="display: flex; gap: 16px; font-size: 12px; color: var(--text-muted);">
        <label><input type="checkbox" id="export-only-verified" checked /> 仅导出已校验 (Verified) 样本</label>
        <label><input type="checkbox" id="export-copy-audio" checked /> 复制 WAV 音频到目标目录</label>
      </div>

      <div class="modal-footer">
        <button class="btn-action" id="close-export-modal-btn">取消</button>
        <button class="btn-action primary" id="confirm-export-btn">开始导出</button>
      </div>
    </div>
  </div>

  <audio id="audio-player"></audio>

  <script>
    const { invoke } = window.__TAURI__.core;

    let currentViewMode = "hud"; // "hud" | "workbench"
    let currentFilter = "all";
    let utterances = [];
    let focusedIndex = 0;
    const audioPlayer = document.getElementById("audio-player");

    // ── 窗口拖拽与基础操作 ──
    document.getElementById("drag-region").addEventListener("mousedown", (e) => {
      if (e.target.closest("button") || e.target.closest("select")) return;
      invoke("start_dragging");
    });

    document.getElementById("close-btn").addEventListener("click", () => {
      invoke("close_window");
    });

    document.getElementById("folder-btn").addEventListener("click", () => {
      invoke("open_data_directory");
    });

    // ── 视图切换 ──
    const viewToggleBtn = document.getElementById("view-toggle-btn");
    const hudView = document.getElementById("hud-view");
    const workbenchView = document.getElementById("workbench-view");

    viewToggleBtn.addEventListener("click", async () => {
      currentViewMode = currentViewMode === "hud" ? "workbench" : "hud";
      if (currentViewMode === "workbench") {
        hudView.style.display = "none";
        workbenchView.style.display = "flex";
        viewToggleBtn.classList.add("active");
        await invoke("switch_view_mode", { mode: "workbench" });
        loadUtterances();
      } else {
        hudView.style.display = "flex";
        workbenchView.style.display = "none";
        viewToggleBtn.classList.remove("active");
        await invoke("switch_view_mode", { mode: "hud" });
      }
    });

    // ── 采集模式切换 ──
    const modeSelect = document.getElementById("mode-select");
    modeSelect.addEventListener("change", async (e) => {
      await invoke("set_capture_mode", { mode: e.target.value });
    });

    // ── 消音控制 ──
    const muteBtn = document.getElementById("mute-btn");
    muteBtn.addEventListener("click", async () => {
      const isMuted = await invoke("toggle_mute");
      updateMuteUi(isMuted);
    });

    function updateMuteUi(isMuted) {
      if (isMuted) {
        muteBtn.textContent = "🔇";
        muteBtn.classList.add("active");
      } else {
        muteBtn.textContent = "🎙️";
        muteBtn.classList.remove("active");
      }
    }

    // ── 状态轮询 (高频 100ms 刷新波形与状态) ──
    async function pollStatus() {
      try {
        const status = await invoke("get_app_status");

        // 状态徽标更新
        const statusBadge = document.getElementById("status-badge");
        const statusText = document.getElementById("status-text");
        statusBadge.className = "status-badge " + status.status;

        if (status.is_muted) {
          statusText.textContent = "已消音";
        } else if (status.is_silent) {
          statusText.textContent = "静默采集";
        } else if (status.status === "recording") {
          statusText.textContent = "正在录制";
        } else if (status.status === "listening") {
          statusText.textContent = "监听中";
        } else {
          statusText.textContent = "待机空闲";
        }

        // HUD 电平条更新
        const fillPercent = Math.min(100, Math.max(0, (status.peak_dbfs + 60) * (100 / 60)));
        document.getElementById("hud-level-fill").style.width = fillPercent + "%";
        document.getElementById("hud-dbfs").textContent = status.peak_dbfs.toFixed(1) + " dB";

        // HUD 录制计时器
        if (status.current_duration_s > 0) {
          document.getElementById("hud-timer").textContent = status.current_duration_s.toFixed(1) + "s";
          document.getElementById("hud-timer").style.color = "var(--danger)";
        } else {
          document.getElementById("hud-timer").textContent = "00.0s";
          document.getElementById("hud-timer").style.color = "var(--text-main)";
        }

        // 待转写数量统计
        document.getElementById("stat-pending").textContent = status.pending_asr_count;
        const batchBtn = document.getElementById("batch-asr-btn");
        if (status.pending_asr_count > 0) {
          batchBtn.textContent = `⚡ 批量转写 (${status.pending_asr_count})`;
          batchBtn.style.display = "inline-flex";
        } else {
          batchBtn.textContent = "⚡ 批量转写";
        }

      } catch (err) {
        console.error("Poll status error:", err);
      }
    }
    setInterval(pollStatus, 120);

    // ── 语料加载与渲染 ──
    async function loadUtterances() {
      try {
        utterances = await invoke("list_utterances", {
          sessionId: null,
          statusFilter: currentFilter,
        });
        renderUtteranceList();
        updateStats();
      } catch (err) {
        console.error("Failed to load utterances:", err);
      }
    }

    function updateStats() {
      const valid = utterances.filter(u => u.status !== "Rejected");
      const totalMs = valid.reduce((acc, u) => acc + u.duration_ms, 0);
      const verified = valid.filter(u => u.verified).length;

      document.getElementById("stat-count").textContent = valid.length;
      const totalSec = Math.floor(totalMs / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      document.getElementById("stat-duration").textContent =
        `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      document.getElementById("stat-verified").textContent = `${verified} / ${valid.length}`;
    }

    function renderUtteranceList() {
      const listEl = document.getElementById("utterance-list");
      listEl.innerHTML = "";

      if (utterances.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-dim); font-size: 13px;">暂无语音切片，请对着麦克风说话或切换模式开始录制</div>`;
        return;
      }

      utterances.forEach((u, idx) => {
        const card = document.createElement("div");
        card.className = "utterance-card";
        if (u.verified) card.classList.add("verified");
        if (u.peak_dbfs >= -0.3) card.classList.add("clipping");
        if (idx === focusedIndex) card.classList.add("focused");
        card.dataset.index = idx;

        const durSec = (u.duration_ms / 1000).toFixed(1) + "s";
        const isClipping = u.peak_dbfs >= -0.3;

        card.innerHTML = `
          <button class="play-btn" data-id="${u.id}" data-path="${u.audio_filepath}" title="播放/重播 (Tab)">▶</button>
          <div class="card-meta">
            <div class="card-id" title="${u.id}">${u.id}</div>
            <div class="card-tags">
              <span class="tag">${durSec}</span>
              <span class="tag">${u.peak_dbfs.toFixed(1)}dB</span>
              ${isClipping ? '<span class="tag clipping-tag">削波!</span>' : ''}
              ${u.emotion ? `<span class="tag" style="color:var(--accent-color)">${u.emotion}</span>` : ''}
            </div>
          </div>
          <div class="card-input-wrapper">
            <input type="text" class="card-text-input" value="${escapeHtml(u.text)}"
              data-id="${u.id}" placeholder="${u.status === 'Pending_ASR' ? '等待离线 ASR 转写中...' : '点击编辑文本内容...'}" />
          </div>
          <div class="card-actions">
            <button class="btn-action ${u.verified ? 'primary' : ''}" style="padding: 4px 8px; font-size: 11px;"
              data-action="verify" data-id="${u.id}">${u.verified ? '✓ 已校验' : '确认'}</button>
            <button class="btn-action" style="padding: 4px 8px; font-size: 11px; color: var(--danger);"
              data-action="delete" data-id="${u.id}">🗑️</button>
          </div>
        `;

        // 播放按钮
        card.querySelector(".play-btn").addEventListener("click", () => playUtteranceAudio(u.audio_filepath));

        // 文本框 Enter / Tab 交互
        const input = card.querySelector(".card-text-input");
        input.addEventListener("focus", () => {
          focusedIndex = idx;
          highlightFocusedCard();
        });

        input.addEventListener("keydown", async (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            // 保存并标记已校验
            await invoke("update_utterance_text", {
              id: u.id,
              text: input.value,
              textNormalized: null,
              verified: true,
            });
            u.text = input.value;
            u.verified = true;
            card.classList.add("verified");
            // 跳下一行并播放
            focusNextUtterance(idx);
          } else if (e.key === "Tab") {
            e.preventDefault();
            playUtteranceAudio(u.audio_filepath);
          }
        });

        // 校验按钮
        card.querySelector('[data-action="verify"]').addEventListener("click", async () => {
          await invoke("mark_utterance_status", { id: u.id, status: u.verified ? "Transcribed" : "Verified" });
          u.verified = !u.verified;
          card.classList.toggle("verified", u.verified);
          updateStats();
        });

        // 剔除删除按钮
        card.querySelector('[data-action="delete"]').addEventListener("click", async () => {
          await invoke("delete_utterance", { id: u.id });
          utterances.splice(idx, 1);
          renderUtteranceList();
          updateStats();
        });

        listEl.appendChild(card);
      });
    }

    function highlightFocusedCard() {
      document.querySelectorAll(".utterance-card").forEach((c, idx) => {
        c.classList.toggle("focused", idx === focusedIndex);
      });
    }

    function focusNextUtterance(currentIndex) {
      const nextIndex = currentIndex + 1;
      if (nextIndex < utterances.length) {
        focusedIndex = nextIndex;
        highlightFocusedCard();
        const nextInput = document.querySelector(`.utterance-card[data-index="${nextIndex}"] .card-text-input`);
        if (nextInput) {
          nextInput.focus();
          playUtteranceAudio(utterances[nextIndex].audio_filepath);
        }
      }
    }

    async function playUtteranceAudio(filepath) {
      try {
        const dataUrl = await invoke("read_audio_base64", { filepath });
        audioPlayer.src = dataUrl;
        audioPlayer.play();
      } catch (err) {
        console.error("Play audio failed:", err);
      }
    }

    function escapeHtml(text) {
      return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // ── 筛选切换 ──
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        loadUtterances();
      });
    });

    // ── 批量 ASR ──
    document.getElementById("batch-asr-btn").addEventListener("click", async () => {
      try {
        const count = await invoke("run_batch_asr", { sessionId: null });
        alert(`已开始后台批量转写 ${count} 条切片，将在数秒内逐步完成！`);
        setTimeout(loadUtterances, 1500);
      } catch (err) {
        alert("批量转写失败: " + err);
      }
    });

    // ── 导出模态窗 ──
    const exportModal = document.getElementById("export-modal");
    document.getElementById("open-export-modal-btn").addEventListener("click", () => {
      exportModal.style.display = "flex";
      // 默认填充建议路径
      if (!document.getElementById("export-dir").value) {
        document.getElementById("export-dir").value = "~/voiceforge_dataset";
      }
    });

    document.getElementById("close-export-modal-btn").addEventListener("click", () => {
      exportModal.style.display = "none";
    });

    document.getElementById("confirm-export-btn").addEventListener("click", async () => {
      const format = document.getElementById("export-format").value;
      const targetDir = document.getElementById("export-dir").value;
      const valRatio = parseFloat(document.getElementById("export-val-ratio").value) || 0.1;
      const onlyVerified = document.getElementById("export-only-verified").checked;
      const copyAudio = document.getElementById("export-copy-audio").checked;

      if (!targetDir.trim()) {
        alert("请输入导出目录路径！");
        return;
      }

      try {
        const res = await invoke("export_dataset", {
          options: {
            format,
            targetDir,
            sessionId: null,
            onlyVerified,
            valRatio,
            copyAudio,
          }
        });
        alert(res);
        exportModal.style.display = "none";
      } catch (err) {
        alert("导出失败: " + err);
      }
    });

    // 页面加载时自动初始轮询
    pollStatus();
  </script>
</body>
</html>
